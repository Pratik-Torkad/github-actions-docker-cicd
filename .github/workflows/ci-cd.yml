name: CI/CD - Flask and Docker

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/pratik-torkad/flask-cicd-demo

jobs:
  test:
    name: Test Python application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore
          retention-days: 7

  build-and-scan:
    name: Build and scan Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: flask-cicd-demo:ci

      - name: Verify runtime package versions
        run: |
          docker run --rm flask-cicd-demo:ci python -c "import setuptools; print('setuptools:', setuptools.__version__, setuptools.__file__)"

      - name: Locate setuptools metadata in image
        run: |
          docker run --rm --user 0 --entrypoint sh flask-cicd-demo:ci -c '
            echo "Setuptools distribution metadata:"
            find /usr/local /usr/lib -type f -path "*/setuptools-*.dist-info/METADATA" -exec grep -H "^Version:" {} \; 2>/dev/null || true
            echo "Debian setuptools package:"
            dpkg-query -W -f="${Version}\n" python3-setuptools 2>/dev/null || true
          '

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            -v "$PWD:/work" -w /work \
            aquasec/trivy:0.70.0 image \
            --scanners vuln \
            --ignore-unfixed \
            --format json \
            --output /work/trivy-report.json \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            flask-cicd-demo:ci
          echo "High/Critical vulnerabilities found by Trivy:"
          jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL") | [.PkgName, .InstalledVersion, .VulnerabilityID, (.PkgPath // "path unavailable")] | @tsv' trivy-report.json
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' trivy-report.json)
          if [ "$COUNT" -gt 0 ]; then
            echo "Trivy found $COUNT HIGH/CRITICAL vulnerability record(s)."
            exit 1
          fi

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-image-report
          path: trivy-report.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish image to GitHub Container Registry
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build-and-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: true
